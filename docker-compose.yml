# Développement local : PostgreSQL seulement (docker compose up -d db).
# La base de tests (auscii_test) est créée par `pnpm test` au premier lancement.
services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: auscii
      POSTGRES_PASSWORD: auscii
      POSTGRES_DB: auscii
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
